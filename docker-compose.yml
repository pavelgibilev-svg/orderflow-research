version: "3.8"

# Two services: ClickHouse (the database) and live-recorder (the Node.js
# Binance public market-data recorder). Trading endpoints are NEVER touched
# — see src/live-recorder/binanceWsClient.ts and binanceRestClient.ts: only
# public REST `/fapi/v1/depth` and public WS `fstream.binance.com/stream` are
# used; no API key, no order endpoints, no signed requests.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: orderflow-clickhouse
    ports:
      - "8123:8123"  # HTTP
      - "9000:9000"  # Native
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-orderflow}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  live-recorder:
    image: node:22-alpine
    container_name: orderflow-live-recorder
    depends_on:
      clickhouse:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
      - ./data/live-spool:/app/data/live-spool
    environment:
      EXCHANGE: binance-futures
      SYMBOLS: ${SYMBOLS:-BTCUSDT}
      DEPTH_STREAM_SPEED: ${DEPTH_STREAM_SPEED:-100ms}
      SNAPSHOT_INTERVAL_MS: ${SNAPSHOT_INTERVAL_MS:-1000}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-orderflow}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      RAW_SPOOL_DIR: /app/data/live-spool
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Install once, then run the recorder. For development you can override
    # the command to e.g. `sh -c "npm install && npm run live:recorder:dev"`.
    command: >
      sh -c "npm install --silent &&
             npx tsx src/cli/dbMigrate.ts &&
             npx tsx src/cli/liveRecorder.ts"
    restart: unless-stopped

volumes:
  clickhouse-data:
  clickhouse-logs:
